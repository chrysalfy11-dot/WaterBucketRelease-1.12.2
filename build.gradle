// ForgeGradle 2.3 (Forge 1.12.2). Requer Java 8 e Gradle 4.9 (use o gradlew do MDK oficial).
buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven { name = "forge"; url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.example.waterbucketrelease"
archivesBaseName = "waterbucketrelease-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'
compileJava { sourceCompatibility = targetCompatibility = '1.8' }

minecraft {
    version = "1.12.2-14.23.5.2859"
    runDir = "run"
    mappings = "stable_39"
}
