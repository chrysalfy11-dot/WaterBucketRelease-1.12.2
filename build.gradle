buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 3+ é OBRIGATÓRIO para ler o formato UserDev 3 da 1.12.2
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
    // Força o uso do Gradle 4.9/5.x internamente se houver conflito
    configurations.classpath {
        resolutionStrategy {
            force 'net.minecraftforge.gradle:ForgeGradle:3.+'
        }
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'com.example.waterbucketrelease'
archivesBaseName = 'waterbucketrelease'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
}

processResources {
    // Hardcodamos "1.12.2" aqui para evitar o bug de avaliação do FG3
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': "1.12.2"
    }
    
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "waterbucketrelease",
            "Specification-Vendor": "agentzz",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"agentzz",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Garante que o jar final seja reofuscado para funcionar no jogo
jar.finalizedBy('reobfJar')
